#
# index-srv 前端与 TLS 终结（前后端分离部署）
#
# 职责划分：
#   本容器（nginx:stable-alpine）→ TLS 终结 + 静态资源直出 + /api 反向代理
#   api 容器（node）            → 只提供 /api，不对宿主机暴露端口（外部无法绕过 nginx 直连）
#
# 挂载点（见 docker-compose.yml）：
#   /usr/share/nginx/html       ← 仓库的 src/web（只读挂载，无构建步骤）
#   /etc/nginx/ssl/server.crt   ← ~/.ssl/server.crt
#   /etc/nginx/ssl/server.key   ← ~/.ssl/server.key
#   /etc/nginx/ssl/ca.crt       ← ~/.ssl/ca.crt（仅双向 TLS 用，默认不启用）
#
# 注意：证书若打了客户端校验（mTLS），必须同时保证 SAN 覆盖你访问用的地址/IP，
# 否则浏览器会先因为证书不匹配而拒绝连接。生成方式见 readme.md 的部署章节。

# ---------- http：全部跳转到 https ----------
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  # 自签证书首次访问会先看到浏览器的证书警告（导入 ca.crt 后消失），属正常现象
  return 301 https://$host$request_uri;
}

# ---------- https：静态资源 + API 反代 ----------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;

  # ---- TLS ----
  ssl_certificate     /etc/nginx/ssl/server.crt;
  ssl_certificate_key /etc/nginx/ssl/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # 可选：双向 TLS（客户端也必须带证书）。默认关闭 —— 打开后没有客户端证书的设备
  # 连页面都打不开，确认已给所有要访问的设备签发并安装证书之后再启用。
  # ssl_client_certificate /etc/nginx/ssl/ca.crt;
  # ssl_verify_client on;

  server_tokens off;

  # 与后端 applyCommonHeaders 保持一致：静态资源由 nginx 直接发出，不经过 Node
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options SAMEORIGIN always;
  # 与后端 web.cacheMaxAge=0 的策略一致：协商缓存（ETag）+ 不强制缓存 ——
  # 静态文件名不带哈希，升级后刷新即可拿到新资源
  add_header Cache-Control "no-cache" always;

  root /usr/share/nginx/html;
  index index.html;

  # ---- 静态资源：直接由 nginx 发出 ----
  location / {
    try_files $uri $uri/ =404;
  }

  # ---- API：反向代理到后端容器 ----
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # 关键（白名单 IP）：尾部追加「nginx 亲眼看到的对端」。后端只在「直连对端属于
    # server.trustedProxies」时才采信这个头，且只取最右一项（不向左回溯）——
    # 客户端自己塞进头里的伪造值永远不会成为最右项（见 docs/api.md）。
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # 与后端 server.requestLimitBytes（256 KiB）对齐
    client_max_body_size 256k;
    # 整份导出可能比较大，读超时给宽一些
    proxy_read_timeout 60s;
    # 写操作与提升接口都不该被缓存
    proxy_buffering off;
  }
}
